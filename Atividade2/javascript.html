<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano???</title>
</head>
<body>
    <label for="inp">Nome: </label>
    <input type="text" id="inp"><br><br>
    <button onclick="mudarTexto()">Mande apertando aqui!</button>

    <script>
        function mudarTexto() {
            let nome = document.getElementById("inp").value;
            alert("Olá " + nome + "!");
        }
    </script>
</body>
</html>
